name: Set up JDK, Gradle and Android SDK
description: Shared setup for jobs that build/test/lint the Android or KMP-common code.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Install required Android SDK packages
      shell: bash
      run: |
        ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
        yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "platform-tools"

    - name: Placeholder google-services.json
      shell: bash
      run: |
        if [ -f androidApp/google-services.json.ci ]; then
          cp androidApp/google-services.json.ci androidApp/google-services.json
        fi
